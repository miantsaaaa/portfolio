<section id="contact" class="section-shell">

  <div class="container">

    <div class="section-heading reveal">

      <span class="section-number">
        09
      </span>

      <div>
        <span class="section-kicker">
          CONTACT
        </span>

        <h2>
          Construisons quelque chose.
        </h2>
      </div>

      <p>
        Une idée, un projet, une mission ou une opportunité ?
        Parlons-en.
      </p>

    </div>


    <div class="contact-grid">


      <form
        id="contactForm"
        class="glass-card contact-form reveal"
      >

        <div class="form-row">

          <label>

            <span>
              Nom
            </span>

            <input
              type="text"
              name="name"
              placeholder="Votre nom"
              required
            >

          </label>


          <label>

            <span>
              Email
            </span>

            <input
              type="email"
              name="email"
              placeholder="vous@example.com"
              required
            >

          </label>

        </div>


        <label>

          <span>
            Sujet
          </span>

          <input
            type="text"
            name="subject"
            placeholder="Sujet"
          >

        </label>


        <label>

          <span>
            Message
          </span>

          <textarea
            name="message"
            rows="7"
            placeholder="Décrivez votre projet..."
            required
          ></textarea>

        </label>


        <button
          type="submit"
          class="btn btn-primary"
        >
          Envoyer le message
          <span>↗</span>
        </button>


        <p
          id="formStatus"
          class="form-status"
          aria-live="polite"
        ></p>

      </form>


      <aside class="glass-card contact-info reveal reveal-delay-1">

        <span class="card-label">
          Coordonnées
        </span>


        <h3>
          Restons en contact.
        </h3>


        <a
          href="mailto:email@example.com"
          class="contact-item"
        >

          <span>
            Email
          </span>

          <!--
            PERSONNEL
            Exemple :
            miantsa@example.com
          -->

          <strong>
            email@example.com
          </strong>

        </a>


        <div class="contact-item">

          <span>
            Téléphone
          </span>

          <!--
            PERSONNEL
            Exemple :
            +261 XX XX XXX XX
          -->

          <strong>
            À compléter
          </strong>

        </div>


        <div class="contact-item">

          <span>
            Localisation
          </span>

          <!-- PERSONNEL -->

          <strong>
            Ville, Pays
          </strong>

        </div>


        <div class="contact-socials">

          <!-- PERSONNEL -->

          <a href="#">
            GitHub
          </a>

          <!-- PERSONNEL -->

          <a href="#">
            LinkedIn
          </a>

        </div>

      </aside>

    </div>

  </div>

</section>
